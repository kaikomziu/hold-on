<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOLD ON - 長押しガマンゲーム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg1:#0f1226; --bg2:#1b2148; --ink:#eaf0ff; --sub:#9aa6d4;
    --accent:#5df2c4; --accent2:#ffd24d; --bad:#ff6b8b; --panel:rgba(12,16,38,.78);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg1) 70%);
    color:var(--ink); overflow:hidden; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{position:relative; width:100vw; height:100dvh; max-width:520px; max-height:920px;
    overflow:hidden;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:26px; text-align:center;
    transition:opacity .25s; overflow-y:auto;}
  .hidden{opacity:0; pointer-events:none;}

  h1{font-size:clamp(40px,15vw,72px); letter-spacing:.08em; line-height:1;
    text-shadow:0 0 24px rgba(93,242,196,.5), 0 4px 0 #14324a;}
  h1 small{display:block; font-size:.24em; letter-spacing:.5em; color:var(--accent2);
    margin-top:14px; text-shadow:none;}
  p.lead{font-size:13.5px; line-height:2; color:var(--sub); max-width:330px;}
  .lead b{color:var(--ink)}

  .btn{
    border:none; cursor:pointer; font:800 19px/1 inherit; color:#06231b;
    background:linear-gradient(180deg,#9dffdf,#3fe3b4);
    padding:16px 46px; border-radius:999px;
    box-shadow:0 8px 0 #1f8f70, 0 14px 30px rgba(0,0,0,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(5px); box-shadow:0 3px 0 #1f8f70, 0 6px 14px rgba(0,0,0,.4);}
  .btn.ghost{
    color:var(--sub); background:transparent;
    box-shadow:inset 0 0 0 1.5px rgba(154,166,212,.4);
    font-weight:700; font-size:15px; padding:12px 30px;
  }
  .btn.ghost:active{transform:translateY(2px); box-shadow:inset 0 0 0 1.5px rgba(154,166,212,.4);}
  .btn.small{font-size:15px; padding:13px 30px;}

  /* --- game screen --- */
  .round-tag{font-size:12px; letter-spacing:.35em; color:var(--sub);}
  .target{font-size:15px; color:var(--sub); line-height:1.7;}
  .target b{display:block; font-size:44px; color:var(--accent2); letter-spacing:.02em;
    text-shadow:0 0 20px rgba(255,210,77,.4); margin-top:2px;}
  .pad{
    position:relative; width:min(64vw,240px); aspect-ratio:1; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #2b356e, #171d40);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.08), 0 10px 40px rgba(0,0,0,.45);
    font-size:17px; font-weight:800; letter-spacing:.15em; color:var(--sub);
    cursor:pointer; transition:transform .12s ease, box-shadow .12s;
  }
  .pad.holding{
    transform:scale(.94);
    color:var(--accent);
    box-shadow:inset 0 0 0 2px var(--accent), 0 0 60px rgba(93,242,196,.45);
    background:radial-gradient(circle at 50% 40%, #33608a, #12324a);
  }
  .pad .ripple{position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent);
    opacity:0; pointer-events:none;}
  .pad.holding .ripple{animation:rip 1.6s ease-out infinite;}
  @keyframes rip{0%{transform:scale(.7); opacity:.7} 100%{transform:scale(1.25); opacity:0}}
  .hint{font-size:12px; color:var(--sub); min-height:1.4em; letter-spacing:.05em;}

  /* --- round flash --- */
  .flash{
    position:absolute; inset:0; background:var(--panel); backdrop-filter:blur(3px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .flash.show{opacity:1;}
  .flash .verdict{font-size:34px; font-weight:800; letter-spacing:.06em;}
  .flash .detail{font-size:14px; color:var(--sub); line-height:1.9;}
  .flash .detail em{font-style:normal; color:var(--ink); font-weight:700;}

  /* --- final --- */
  .rank{font-size:clamp(28px,10vw,44px); font-weight:800; letter-spacing:.05em;
    color:var(--accent); text-shadow:0 0 24px rgba(93,242,196,.4);}
  .score-big{font-size:15px; color:var(--sub);}
  .score-big b{display:block; font-size:40px; color:var(--ink); margin-top:2px;}
  .breakdown{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:320px;}
  .chip{font-size:12px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.06);
    color:var(--sub);}
  .chip b{color:var(--ink)}
  .best{font-size:12px; color:var(--accent2); letter-spacing:.1em; min-height:1em;}

  /* --- ranking submit --- */
  .submit-box{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;
    max-width:320px;}
  .name-row{display:flex; gap:8px; width:100%;}
  .name-row input{
    flex:1; min-width:0; font:600 16px/1 inherit; color:var(--ink);
    background:rgba(255,255,255,.07); border:1.5px solid rgba(154,166,212,.35);
    border-radius:12px; padding:12px 14px; -webkit-user-select:text; user-select:text;
  }
  .name-row input:focus{outline:none; border-color:var(--accent);}
  .submit-note{font-size:11.5px; color:var(--sub); line-height:1.7;}
  .submit-note.ok{color:var(--accent);}
  .submit-note.err{color:var(--bad);}
  .test-badge{
    font-size:12px; font-weight:700; letter-spacing:.05em; color:#0c1226;
    background:linear-gradient(180deg,#ffe08a,#ffc21f); padding:8px 16px; border-radius:999px;
  }

  /* --- ranking list --- */
  .rk-title{font-size:24px; font-weight:800; letter-spacing:.04em;}
  .rk-sub{font-size:12px; color:var(--sub); margin-top:-8px;}
  .rk-list{width:100%; max-width:360px; max-height:56vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:4px; -webkit-overflow-scrolling:touch;}
  .rk-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
    background:rgba(255,255,255,.05); font-size:14px;}
  .rk-row .pos{width:26px; text-align:center; font-weight:800; color:var(--sub); flex:none;}
  .rk-row.top1 .pos{color:#ffd24d} .rk-row.top2 .pos{color:#d8def0} .rk-row.top3 .pos{color:#e6a86b}
  .rk-row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-align:left;}
  .rk-row .sc{font-weight:800; color:var(--accent); flex:none;}
  .rk-row.me{background:rgba(93,242,196,.13); box-shadow:inset 0 0 0 1px rgba(93,242,196,.4);}
  .rk-empty{font-size:13px; color:var(--sub); padding:20px 0;}

  .ver{position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-size:10px; color:rgba(154,166,212,.5); letter-spacing:.2em;}
</style>
</head>
<body>
<div id="wrap">

  <section class="screen" id="title">
    <h1>HOLD ON<small>長押しガマン</small></h1>
    <p class="lead">
      表示された秒数だけ、ボタンを<b>長押し</b>して離すだけ。<br>
      ただし押してる間、<b>時間は表示されません</b>。<br>
      たよれるのは体内時計だけ。<b>全5回</b>のズレ合計で称号が決まります。
    </p>
    <button class="btn" id="startBtn">スタート</button>
    <button class="btn ghost" id="rankBtnTitle">🌍 世界ランキング</button>
    <p class="lead">PC: スペースキー長押しでもOK</p>
    <p class="best" id="titleBest"></p>
  </section>

  <section class="screen hidden" id="game">
    <div class="round-tag" id="roundTag">ROUND 1 / 5</div>
    <div class="target">この秒数をキープして離す<b id="targetNum">2.00秒</b></div>
    <div class="pad" id="pad"><span class="ripple"></span><span id="padLabel">長 押 し</span></div>
    <div class="hint" id="hint">準備ができたら押しっぱなし</div>
    <div class="flash" id="flash">
      <div class="verdict" id="verdict"></div>
      <div class="detail" id="detail"></div>
    </div>
  </section>

  <section class="screen hidden" id="final">
    <div class="rank" id="rankText">—</div>
    <div class="score-big">ズレ合計<b id="totalDiff">0.00秒</b></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="best" id="finalBest"></div>

    <div class="submit-box" id="submitBox">
      <div class="name-row" id="nameRow">
        <input id="nameInput" type="text" maxlength="12" placeholder="なまえ（12文字まで）"
               autocomplete="off" spellcheck="false">
        <button class="btn small" id="submitBtn">登録</button>
      </div>
      <div class="submit-note" id="submitNote">世界ランキングに記録を登録できます</div>
      <div class="test-badge hidden" id="testBadge">🧪 テストモード（記録は送信されません）</div>
    </div>

    <button class="btn ghost" id="rankBtnFinal">🌍 世界ランキングを見る</button>
    <button class="btn" id="retryBtn">もう一度</button>
  </section>

  <section class="screen hidden" id="ranking">
    <div class="rk-title">🌍 世界ランキング</div>
    <div class="rk-sub">ズレ合計が小さい順・上位50</div>
    <div class="rk-list" id="rkList"><div class="rk-empty">読み込み中…</div></div>
    <button class="btn ghost" id="rkClose">もどる</button>
  </section>

  <div class="ver" id="verTag"></div>
</div>

<script>
const VERSION = "1.1.1";
/* CHANGELOG
 1.0.0 (2026-08-29) 初版。全5ラウンドの長押しガマンゲーム。体内時計でズレ合計を競い、7段階の称号判定。ベストはlocalStorage保存。
 1.1.0 (2026-08-29) Supabaseで世界ランキングを実装。?test を付けたURLでは記録が送信されないテストモードになる。
 1.1.1 (2026-08-29) 共通オリジンで他ゲームのSupabaseログインを拾い登録がRLSで弾かれる不具合を修正(anon固定 + ポリシーを全ロール許可)。
*/

const $ = s => document.querySelector(s);
const BEST_KEY = "holdon_best_v1";
const NAME_KEY = "holdon_name";

/* ?test / ?spectate でテストモード（世界ランキングに送信しない） */
const TEST_MODE = /[?&](test|spectate)\b/.test(location.search);

/* ===== 世界ランキング (Supabase) ===== */
const HoldonRanking = (() => {
  const SUPABASE_URL = "https://kifnzvktwbomxthzvvgy.supabase.co";
  // 同プロジェクトで実際に書き込みに使われている従来形式(JWT)のanon key。
  // 新形式のpublishable keyはINSERTが403で弾かれるため使わない。
  const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpZm56dmt0d2JvbXh0aHp2dmd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzgxMzgsImV4cCI6MjA5MzQxNDEzOH0.M7nXP-u--6J_6rRpgz1cJj21_7KX6MtfTmZy77Xf_IE";
  const TABLE = "holdon_scores";

  let client = null;
  function sb(){
    if (client) return client;
    if (!window.supabase || !window.supabase.createClient) return null;
    // kaikomziu.github.io は全ゲーム共通オリジン = localStorage 共有。
    // 他ゲーム(mecha-chameleon等)のSupabaseログインセッションを拾って
    // authenticatedロールで送信してしまわないよう、認証状態を一切持たせない。
    client = window.supabase.createClient(SUPABASE_URL, KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      global: { headers: { Authorization: "Bearer " + KEY } },
    });
    return client;
  }

  async function fetchTop(limit = 50){
    const c = sb();
    if (!c) throw new Error("接続できませんでした");
    const { data, error } = await c
      .from(TABLE)
      .select("name,total_ms,best_round_ms,created_at")
      .order("total_ms", { ascending: true })
      .order("best_round_ms", { ascending: true })
      .limit(limit);
    if (error) throw error;
    return data || [];
  }

  async function estimateRank(totalMs){
    const c = sb();
    if (!c) return null;
    const { count, error } = await c
      .from(TABLE)
      .select("id", { count: "exact", head: true })
      .lt("total_ms", totalMs);
    if (error) return null;
    return (count || 0) + 1;
  }

  async function submit(name, totalMs, bestRoundMs, rounds){
    const c = sb();
    if (!c) throw new Error("接続できませんでした");
    const cleanName = String(name).trim().slice(0, 12);
    if (!cleanName) throw new Error("なまえを入力してください");
    if (!(totalMs >= 0 && totalMs < 60000) || !(bestRoundMs >= 0 && bestRoundMs < 20000)){
      throw new Error("不正なスコアです");
    }
    const row = {
      name: cleanName,
      total_ms: Math.round(totalMs * 10) / 10,
      best_round_ms: Math.round(bestRoundMs * 10) / 10,
    };
    if (Array.isArray(rounds) && rounds.length) row.rounds = rounds;
    const { error } = await c.from(TABLE).insert(row);
    if (error) throw error;
  }

  return { fetchTop, estimateRank, submit };
})();

/* ===== ゲーム本体 ===== */
const ROUNDS = 5;
let targets = [];        // 秒
let idx = 0;
let diffs = [];          // ms 絶対値
let signed = [];         // ms 符号付き
let held = [];           // ms 実際にキープした時間
let holdStart = 0;
let holding = false;
let locked = false;
let lastTotal = 0;
let submitted = false;
let rankReturnTo = "title";

const RANKS = [
  { max: 250,   name: "時の支配者",       note: "体内にセシウム原子時計" },
  { max: 500,   name: "体内時計マスター",  note: "腕時計いらないでしょ" },
  { max: 900,   name: "なかなかの精度",    note: "だいたい合ってる、が信条" },
  { max: 1500,  name: "そこそこ人間",      note: "3秒は3秒くらい" },
  { max: 2500,  name: "おおらか",         note: "時間は概念だからね" },
  { max: 4000,  name: "気合で生きてる",    note: "感覚がすべて" },
  { max: Infinity, name: "時空のはぐれ者", note: "秒とは……？" },
];

function randTarget(){
  const v = 1.2 + Math.random() * 4.6;   // 1.20〜5.80秒
  return Math.round(v * 20) / 20;        // 0.05刻み
}
const fmt = sec => sec.toFixed(2) + "秒";

function loadBest(){
  const v = Number(localStorage.getItem(BEST_KEY));
  return Number.isFinite(v) && v > 0 ? v : null;
}
function showTitleBest(){
  const b = loadBest();
  $("#titleBest").textContent = b ? `ベスト: ズレ合計 ${(b/1000).toFixed(2)}秒` : "";
}

function show(id){
  ["title","game","final","ranking"].forEach(s =>
    $("#" + s).classList.toggle("hidden", s !== id));
}

function startGame(){
  targets = Array.from({ length: ROUNDS }, randTarget);
  idx = 0; diffs = []; signed = []; held = [];
  submitted = false;
  show("game");
  nextRound();
}

function nextRound(){
  locked = false; holding = false;
  $("#roundTag").textContent = `ROUND ${idx + 1} / ${ROUNDS}`;
  $("#targetNum").textContent = fmt(targets[idx]);
  $("#hint").textContent = "準備ができたら押しっぱなし";
  $("#padLabel").textContent = "長 押 し";
  $("#pad").classList.remove("holding");
  $("#flash").classList.remove("show");
}

function beginHold(){
  if (locked || holding) return;
  holding = true;
  holdStart = performance.now();
  $("#pad").classList.add("holding");
  $("#padLabel").textContent = "キープ…";
  $("#hint").textContent = "ちょうどで指を離す";
}

function endHold(){
  if (!holding) return;
  holding = false;
  const elapsed = performance.now() - holdStart;
  $("#pad").classList.remove("holding");
  $("#padLabel").textContent = "長 押 し";

  const target = targets[idx] * 1000;
  const d = elapsed - target;
  const ad = Math.abs(d);
  diffs.push(ad); signed.push(d); held.push(elapsed);

  let verdict, color;
  if (ad < 50)      { verdict = "PERFECT!"; color = "var(--accent)"; }
  else if (ad < 150){ verdict = "すごい";   color = "var(--accent)"; }
  else if (ad < 400){ verdict = "おしい";   color = "var(--accent2)"; }
  else if (ad < 900){ verdict = "うーん";   color = "var(--accent2)"; }
  else              { verdict = "ズレすぎ"; color = "var(--bad)"; }

  $("#verdict").textContent = verdict;
  $("#verdict").style.color = color;
  $("#detail").innerHTML =
    `キープ <em>${(elapsed/1000).toFixed(2)}秒</em> / お題 ${(target/1000).toFixed(2)}秒<br>` +
    `ズレ <em>${ad.toFixed(0)}ms</em>（${d > 0 ? "長かった" : "短かった"}）`;
  $("#flash").classList.add("show");
  locked = true;

  setTimeout(() => {
    idx++;
    if (idx >= ROUNDS) finish();
    else nextRound();
  }, 1500);
}

function finish(){
  const total = diffs.reduce((a, b) => a + b, 0);
  lastTotal = total;
  const rank = RANKS.find(r => total <= r.max);
  $("#rankText").textContent = rank.name;
  $("#totalDiff").textContent = (total / 1000).toFixed(2) + "秒";

  $("#breakdown").innerHTML = signed.map((d, i) =>
    `<span class="chip">R${i + 1} <b>${d >= 0 ? "+" : ""}${(d/1000).toFixed(2)}</b></span>`
  ).join("") + `<span class="chip" style="color:var(--sub)">${rank.note}</span>`;

  const prev = loadBest();
  if (prev == null || total < prev){
    localStorage.setItem(BEST_KEY, String(Math.round(total)));
    $("#finalBest").textContent = "🎉 自己ベスト更新！";
  } else {
    $("#finalBest").textContent = `ベスト: ${(prev/1000).toFixed(2)}秒`;
  }

  // ランキング登録UIの状態リセット
  submitted = false;
  $("#nameRow").classList.toggle("hidden", TEST_MODE);
  $("#testBadge").classList.toggle("hidden", !TEST_MODE);
  $("#submitBtn").disabled = false;
  if (TEST_MODE){
    $("#submitNote").textContent = "";
    $("#submitNote").className = "submit-note";
  } else {
    $("#submitNote").textContent = "世界ランキングに記録を登録できます";
    $("#submitNote").className = "submit-note";
    $("#nameInput").value = localStorage.getItem(NAME_KEY) || "";
  }

  show("final");
  showTitleBest();
}

async function doSubmit(){
  if (submitted || TEST_MODE) return;
  const name = $("#nameInput").value.trim();
  if (!name){
    setNote("なまえを入力してください", "err");
    return;
  }
  $("#submitBtn").disabled = true;
  setNote("送信中…", "");
  try {
    const bestRound = Math.min(...diffs);
    const rounds = targets.map((t, i) => ({ t: Math.round(t * 1000), h: Math.round(held[i]) }));
    await HoldonRanking.submit(name, lastTotal, bestRound, rounds);
    localStorage.setItem(NAME_KEY, name.slice(0, 12));
    submitted = true;
    $("#nameRow").classList.add("hidden");
    let msg = "✅ 世界ランキングに登録しました！";
    const pos = await HoldonRanking.estimateRank(lastTotal);
    if (pos) msg += `  現在 約${pos}位`;
    setNote(msg, "ok");
  } catch (e){
    $("#submitBtn").disabled = false;
    setNote("登録に失敗しました（" + (e.message || e) + "）", "err");
  }
}
function setNote(text, kind){
  const el = $("#submitNote");
  el.textContent = text;
  el.className = "submit-note" + (kind ? " " + kind : "");
}

async function openRanking(from){
  rankReturnTo = from;
  show("ranking");
  const list = $("#rkList");
  list.innerHTML = `<div class="rk-empty">読み込み中…</div>`;
  try {
    const rows = await HoldonRanking.fetchTop(50);
    if (!rows.length){
      list.innerHTML = `<div class="rk-empty">まだ記録がありません。1位を狙おう！</div>`;
      return;
    }
    const myTotal = submitted ? Math.round(lastTotal * 10) / 10 : null;
    let myMarked = false;
    list.innerHTML = rows.map((r, i) => {
      const pos = i + 1;
      const cls = ["rk-row", pos <= 3 ? "top" + pos : ""];
      if (!myMarked && myTotal != null && Math.abs(r.total_ms - myTotal) < 0.05){
        cls.push("me"); myMarked = true;
      }
      const nm = String(r.name).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
      return `<div class="${cls.join(" ")}">
        <span class="pos">${pos}</span>
        <span class="nm">${nm}</span>
        <span class="sc">${(r.total_ms/1000).toFixed(2)}秒</span>
      </div>`;
    }).join("");
  } catch (e){
    list.innerHTML = `<div class="rk-empty">読み込みに失敗しました<br>${e.message || e}</div>`;
  }
}

/* --- 入力 --- */
const pad = $("#pad");
pad.addEventListener("pointerdown", e => {
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  beginHold();
});
pad.addEventListener("pointerup", e => { e.preventDefault(); endHold(); });
pad.addEventListener("pointercancel", () => endHold());
pad.addEventListener("contextmenu", e => e.preventDefault());
